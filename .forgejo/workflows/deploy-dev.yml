name: Deploy Dev

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Test Server
    runs-on: docker
    container:
      image: node:24-alpine

    steps:
      - name: Install system deps
        run: apk add --no-cache git openssh-client rsync

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
          # Keep the token out of .git/config while dependency code runs in later steps
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git checkout "$REF"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (SHA256:nOxgz1IQ0klpetz4Xo0k63rmWac23ZeSwdLm5FrK7NI) instead of
          # ssh-keyscan, which would trust whatever host answers (MITM on first contact)
          echo "cloud.linux-nerds.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPRPf55guMUOVOBQKrphYOe3jpeOm2AJ9g+UF09J2zdT" > ~/.ssh/known_hosts

      # The deploy-contacts user's key is bound to a forced command on the
      # server (deploy/server/contacts-deploy): uploads are confined to the app
      # directory, and "restart" is the only other thing it accepts.
      - name: Upload dist/
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            deploy-contacts@cloud.linux-nerds.org:./

      - name: Restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy-contacts@cloud.linux-nerds.org restart

      - name: Done
        run: echo "Deploy fertig. https://cloud.linux-nerds.org/apps/opencloud-contacts/"
